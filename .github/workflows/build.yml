name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this version, for example 1.0.0. Leave empty to only build."
        required: false
        default: ""

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # WPF can only be compiled on Windows, and the low level hook code has nothing to prove on any
    # other platform, so the whole solution is built here.
    runs-on: windows-latest

    # Needed by the release step on a tag push; the read only default would fail it.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CaYaScreenBridge.sln

      - name: Build
        run: dotnet build CaYaScreenBridge.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/CaYaScreenBridge.Core.Tests/CaYaScreenBridge.Core.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=core-tests.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results

      - name: Determine version
        id: version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF -replace "refs/tags/v", ""
          } elseif ($env:RELEASE_VERSION) {
            $version = $env:RELEASE_VERSION.TrimStart("v")
          } else {
            $version = "1.0.0-build.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "fileVersion=$($version -replace '-.*$','')" >> $env:GITHUB_OUTPUT

      - name: Publish (portable, self-contained)
        run: >
          dotnet publish src/CaYaScreenBridge.Windows/CaYaScreenBridge.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ steps.version.outputs.fileVersion }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}
          --output artifacts/publish

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/dist | Out-Null
          Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/dist/CaYaScreenBridge-${{ steps.version.outputs.version }}-portable-win-x64.zip" -Force

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Installing Inno Setup..."
            choco install innosetup --no-progress -y
          }
          & $iscc "build\installer\CaYaScreenBridge.iss" "/DAppVersion=${{ steps.version.outputs.fileVersion }}" "/DSourceDir=..\..\artifacts\publish"
          Copy-Item "build\installer\Output\*.exe" "artifacts\dist\" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CaYaScreenBridge-${{ steps.version.outputs.version }}
          path: artifacts/dist

      # Publishes either from a pushed v* tag, or on demand from the Actions tab by supplying a
      # version. The action creates the tag itself when it does not exist yet, so a release can be
      # cut without needing tag push rights.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/dist/*
          tag_name: v${{ steps.version.outputs.version }}
          name: CaYaScreenBridge ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
